services:
  postgres:
    image: postgres:16
    container_name: symptom-witch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: symptom_witch
      POSTGRES_USER: symptom_witch
      POSTGRES_PASSWORD: symptom_witch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
