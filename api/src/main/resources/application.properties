spring.application.name=api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PATCH,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
cors.max-age=${CORS_MAX_AGE:3600}
spring.mvc.problemdetails.enabled=true
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/symptom_witch}
spring.datasource.username=${DATABASE_USER:symptom_witch}
spring.datasource.password=${DATABASE_PASSWORD:symptom_witch}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://symptom-witch.test/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://api.symptomwitch.local}